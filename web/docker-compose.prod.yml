services:
  app:
    restart: unless-stopped
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        TORII_VERSION: ${TORII_VERSION:-dev}
    image: codingcoffee/torii:latest
    ports:
      # Bound to loopback so a fronting TLS terminator is required rather than
      # optional. Published on all interfaces, the gateway answered the public
      # internet from the moment the container started — including during initial
      # setup, before any account existed. Override to "1356:1356" only if
      # something else already terminates TLS in front of this host.
      - "127.0.0.1:1356:1356"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .app.env
    environment:
      APP_ENV: production
      AUDIT_LOG_DIR: /app/logs
    volumes:
      - ./audit-logs:/app/logs
    healthcheck:
      # Every route lives under /_torii/. The old /api/v1/health probe fell through
      # dispatch to a JSON 404, so wget always exited non-zero and the container
      # was permanently unhealthy — which made a genuinely dead gateway
      # indistinguishable from the normal state.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1356/_torii/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/18/docker
    env_file:
      - .postgres.env
    healthcheck:
      test: 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5
