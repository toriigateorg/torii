version: 2

project_name: torii

# The SPA is NOT built here. `just build-spa` stages web/internal/web/dist in a
# separate container with no docker socket, no registry credentials and no GitHub
# token, because building it means executing arbitrary build-time code from the
# whole front-end dependency graph — and this run holds every release credential.
# These hooks only verify that the staged tree exists and is embeddable.
#
# `just release` and `just release-snapshot` invoke build-spa for you. Running
# goreleaser directly requires running it first.
#
# No backticks below: in a plain YAML scalar they reach sh inside double quotes
# and get command-substituted.
before:
  hooks:
    - sh -c "test -f web/internal/web/dist/index.html || { echo 'error: web/internal/web/dist is not staged. Run: just build-spa' >&2; exit 1; }"
    - sh -c "bun web/client/scripts/verify-output.mjs web/internal/web/dist"

builds:
  - id: torii
    dir: web
    main: .
    binary: torii
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X torii/internal/version.Version={{.Version}}

archives:
  - id: torii
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# checksums.txt is generated by the same run that produces the artifacts, so it
# certifies whatever that run produced — a tampered artifact set is internally
# consistent and verifies correctly for downstream users. Splitting the SPA build
# out (see the before: hooks) removes the untrusted-code path into this run, but it
# does not make the checksums independently verifiable. Signing is the control that
# does, and it needs a key decision the pipeline cannot make on its own:
#
#   signs:
#     - cmd: cosign
#       artifacts: checksum
#       args: ["sign-blob", "--key=env://COSIGN_PRIVATE_KEY", "--output-signature=${signature}", "${artifact}", "--yes"]
#
# Uncomment once a cosign key (or keyless OIDC from CI) is provisioned, and publish
# the public key alongside the release.

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?:'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?:'
      order: 1
    - title: Other
      order: 999

dockers:
  - image_templates:
      - "codingcoffee/torii:{{ .Version }}"
      - "codingcoffee/torii:latest"
    dockerfile: web/Dockerfile.release
    use: docker
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/toriigateorg/torii"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

release:
  github:
    owner: toriigateorg
    name: torii
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
